services:
  postgres:
    image: postgres:17-alpine
    container_name: oathgate-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      # Loopback only. Without the 127.0.0.1 this listens on every interface,
      # and a payments database does not belong on the network. My app
      # containers ignore this line, they reach postgres by service name.
      # 5433 keeps it clear of whatever already owns 5432 on the host.
      - '127.0.0.1:5433:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      # compose waits for this before reporting healthy, so migrations do not
      # race the server coming up
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: oathgate-redis
    restart: unless-stopped
    ports:
      # Same reasoning as postgres. Redis has no password here and would be an
      # open door if it listened on every interface.
      - '127.0.0.1:6380:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
  redis_data:
